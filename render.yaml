# Render Blueprint — API + Postgres (frontend on Vercel, Redis on Upstash)
# Dashboard: New → Blueprint → connect this repo
# After deploy: set REDIS_URL from Upstash, then point Vercel VITE_API_URL at the API URL.

databases:
  - name: spinywheely-db
    databaseName: spinywheely
    user: spinywheely
    plan: free

services:
  - type: web
    name: spinywheely-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spinywheely-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Upstash: copy "Redis URL" (rediss://…) from console → Render env
      - key: REDIS_URL
        sync: false
