# Render Blueprint — free-tier full stack for spinyWheely
# Dashboard: https://dashboard.render.com/ → New → Blueprint → connect this repo

databases:
  - name: spinywheely-db
    databaseName: spinywheely
    user: spinywheely
    plan: free

services:
  - type: web
    name: spinywheely-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w @spiny-wheely/backend
    startCommand: npm run start:prod -w @spiny-wheely/backend
    preDeployCommand: npm run migration:run -w @spiny-wheely/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spinywheely-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # REDIS_HOST intentionally unset — single instance, no Render Redis on free tier

  - type: web
    name: spinywheely-web
    runtime: static
    buildCommand: npm ci && npm run build -w @spiny-wheely/frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: spinywheely-api
          envVarKey: RENDER_EXTERNAL_URL
